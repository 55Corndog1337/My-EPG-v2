<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My EPG • Searchable TV Guide</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark;background:#101722;color:#f3f6fc}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;background:#172233;padding:16px;z-index:2;border-bottom:1px solid #364357}h1{font-size:1.3rem;margin:0 0 12px}.controls{display:flex;flex-wrap:wrap;gap:8px}input,select,button{background:#26374c;color:white;border:1px solid #53647b;border-radius:10px;padding:12px;font-size:16px}input{flex:1;min-width:180px}button{cursor:pointer}button.active{background:#2468b4}main{padding:12px;max-width:950px;margin:auto}.item{border:1px solid #34465d;background:#1a2637;border-radius:12px;margin:8px 0;padding:13px}.name{font-weight:700}.channel{font-weight:700;color:#8cc5ff;margin-bottom:5px}.meta{color:#b7c8db;font-size:.85rem;margin-top:5px}.empty{color:#c2d0e0;padding:22px;text-align:center}#status{font-size:.85rem;color:#b7c8db;margin:10px 0}small{font-size:.8rem;color:#bac8d9}a{color:#8cc5ff}#count{font-size:.85rem;color:#bdcee3}
</style></head><body><header><h1>📺 My EPG • TV Guide</h1><div class="controls"><input id="search" type="search" placeholder="Search team, programme, channel…" aria-label="Search programming"><select id="filter" aria-label="Filter"><option value="all">All programming</option><option value="now">On now</option><option value="upcoming">Upcoming</option></select><button id="refresh">Refresh</button></div><div id="status">Loading combined guide…</div><div id="count"></div></header><main><div id="results" class="empty">Loading…</div></main><script>
const url='https://raw.githubusercontent.com/55Corndog1337/My-EPG-v2/main/v4-output/epg.xml.gz';
let entries=[],names=new Map(),lastModified='',loadedAt=0;
const $=id=>document.getElementById(id);
function dateOf(s){const m=/^(\d{4})(\d\d)(\d\d)(\d\d)(\d\d)(\d\d)\s*([+-])(\d\d)(\d\d)/.exec(s||'');if(!m)return NaN;const t=Date.UTC(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+m[6]);return t-(m[7]==='+'?1:-1)*(+m[8]*60+ +m[9])*60000}
function clean(s){return (s||'').trim()}
function render(){const now=Date.now(),q=$('search').value.trim().toLowerCase(),f=$('filter').value;const rows=entries.filter(e=>(!q||(e.title+' '+e.channel).toLowerCase().includes(q))&&(f==='all'||(f==='now'?e.start<=now&&e.stop>now:e.start>now))).sort((a,b)=>{const aNow=a.start<=now&&a.stop>now,bNow=b.start<=now&&b.stop>now;return (bNow-aNow)||(a.start-b.start)});$('count').textContent=rows.length.toLocaleString()+' matching programmes';const root=$('results');root.replaceChildren();if(!rows.length){root.className='empty';root.textContent='No matching programmes. Try another search or filter.';return}root.className='';const frag=document.createDocumentFragment();for(const e of rows.slice(0,250)){const div=document.createElement('article');div.className='item';const channel=document.createElement('div');channel.className='channel';channel.textContent='Channel: '+e.channel;const title=document.createElement('div');title.className='name';title.textContent=e.title;const meta=document.createElement('div');meta.className='meta';meta.textContent=new Date(e.start).toLocaleString([], {weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+' – '+new Date(e.stop).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})+(e.start<=now&&e.stop>now?' • ON NOW':'');div.append(channel,title,meta);frag.append(div)}root.append(frag);if(rows.length>250){const foot=document.createElement('div');foot.className='empty';foot.textContent='Showing first 250 results. Narrow your search to see more.';root.append(foot)}}
async function refresh(){try{$('status').textContent='Checking latest programme index…';const response=await fetch('./programmes.json?t='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();if(!Array.isArray(data.programmes))throw Error('Invalid programme index');entries=data.programmes.map(e=>({channel:e[0],title:e[1],start:e[2]*1000,stop:e[3]*1000}));loadedAt=Date.now();$('status').textContent='Guide generated '+new Date(data.generated).toLocaleString()+' • '+entries.length.toLocaleString()+' listings';render()}catch(err){$('status').textContent='Unable to load guide: '+err.message;if(!entries.length)$('results').textContent='Programme index unavailable. Check the GitHub Pages deployment.'}}
$('search').addEventListener('input',render);$('filter').addEventListener('change',render);$('refresh').addEventListener('click',refresh);refresh();setInterval(refresh,15*60*1000);setInterval(()=>{if(entries.length)render()},60*1000);
</script></body></html>
