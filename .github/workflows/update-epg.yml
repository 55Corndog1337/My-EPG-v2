name: Update EPG
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-epg.yml'
      - 'build_epg.py'
      - 'ahl_schedule.py'
      - 'encrypt_inventory.py'
  schedule:
    - cron: '17 */4 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m py_compile build_epg.py sports_channel_names.py ahl_schedule.py encrypt_inventory.py
      - name: Build public EPG
        run: python build_epg.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      # Do not publish the Xtream inventory or matching reports as public artifacts.
      # They are generated locally for the current run only.
      - name: Install inventory encryption dependency
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: python -m pip install 'cryptography>=43,<47'
      - name: Encrypt latest live Xtream inventory
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          XTREAM_EXPORT_PASSWORD: ${{ secrets.XTREAM_EXPORT_PASSWORD }}
        run: python encrypt_inventory.py
      - name: Upload encrypted inventory only
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: xtream-inventory-encrypted
          path: encrypted-export/xtream-channels-latest.enc.json
          if-no-files-found: error
          retention-days: 1
