name: Update EPG
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-epg.yml'
      - 'build_epg.py'
      - 'sports_channel_names.py'
      - 'ahl_schedule.py'
      - 'encrypt_inventory.py'
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    env:
      XTREAM_URL: ${{ secrets.XTREAM_URL }}
      XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
      XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m py_compile build_epg.py sports_channel_names.py ahl_schedule.py encrypt_inventory.py
      - name: Build public EPG
        run: python build_epg.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
  encrypted-inventory-export:
    runs-on: ubuntu-24.04
    env:
      XTREAM_URL: ${{ secrets.XTREAM_URL }}
      XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
      XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install encryption dependency
        run: python -m pip install 'cryptography>=43,<47'
      - name: Build latest inventory
        run: python build_epg.py
      - name: Encrypt live inventory
        env:
          XTREAM_EXPORT_PASSWORD: ${{ secrets.XTREAM_EXPORT_PASSWORD }}
        run: python encrypt_inventory.py
      - name: Upload encrypted inventory
        uses: actions/upload-artifact@v4
        with:
          name: xtream-inventory-encrypted
          path: encrypted-export/xtream-channels-latest.enc.json
          if-no-files-found: error
          retention-days: 1
