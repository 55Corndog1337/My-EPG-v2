name: Update EPG
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-epg.yml'
      - 'build_epg.py'
  schedule:
    - cron: '17 */4 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build public EPG
        run: python build_epg.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Upload matching reports
        uses: actions/upload-artifact@v4
        with:
          name: epg-matching-reports
          path: reports/
          retention-days: 14
