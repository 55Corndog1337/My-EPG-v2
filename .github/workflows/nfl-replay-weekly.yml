name: NFL Replay weekly board OCR
on:
  workflow_dispatch:
  schedule:
    - cron: '20 13 * * 1'
permissions:
  contents: write
concurrency:
  group: nfl-replay-board
  cancel-in-progress: false
jobs:
  capture-and-read:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      XTREAM_URL: ${{ secrets.XTREAM_URL }}
      XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
      XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Check replay scripts
        run: python -m py_compile nfl_replay_vision.py nfl_replay_board.py
      - name: Read NFL Replay Info HD and delete validated screenshots
        run: python nfl_replay_vision.py
      - name: Commit verified weekly replay assignments
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/nfl-replay-board.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update verified weekly NFL Replay board assignments"
            git push
          fi
