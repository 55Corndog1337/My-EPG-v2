name: Build Portable IPTV EPG Manager for Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'windows/matcher.pyw'
      - '.github/workflows/build-portable-windows.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python on GitHub runner
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependency on runner
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pyinstaller==6.16.0
      - name: Build Windows executable (no console)
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name IPTV_EPG_Manager windows/matcher.pyw
      - name: Create portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path portable -Force | Out-Null
          Copy-Item dist/IPTV_EPG_Manager.exe portable/IPTV_EPG_Manager.exe
          Set-Content -Path portable/START_HERE.txt -Value 'Double-click IPTV_EPG_Manager.exe. No Python installation is required. Keep your Xtream and GitHub tokens private.'
          Compress-Archive -Path portable/* -DestinationPath IPTV_EPG_Manager_Portable_Windows.zip -Force
      - name: Upload portable Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: IPTV_EPG_Manager_Portable_Windows
          path: IPTV_EPG_Manager_Portable_Windows.zip
          retention-days: 30
          if-no-files-found: error
