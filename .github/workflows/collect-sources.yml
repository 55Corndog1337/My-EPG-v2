name: Collect EPG Sources
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */4 * * *'
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect private Xtream inventory and public EPG sources
        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
        run: python scripts/collect_sources.py
      - name: Upload private Xtream inventory
        uses: actions/upload-artifact@v4
        with:
          name: xtream-inventory
          path: private/channels.json
          retention-days: 1
          if-no-files-found: error
      - name: Upload public source snapshots
        uses: actions/upload-artifact@v4
        with:
          name: epg-sources
          path: data/epg*.json
          retention-days: 7
          if-no-files-found: error
