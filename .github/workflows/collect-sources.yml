name: Build and Publish EPG v2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/collect-sources.yml'
      - 'scripts/collect_sources.py'
      - 'build_epg.py'
      - 'sports_channel_names.py'
      - 'sports_guide.py'
      - 'matches.csv'
      - 'approved_mappings.csv'
  schedule:
    - cron: '23 */4 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: epg-v2-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect Xtream privately and validate EPG 2, 6, 37
        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
        run: python scripts/collect_sources.py
      - name: Build XMLTV using fresh sources and Xtream inventory
        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
          EPG2_URL: sources/epg2.xml.gz
          EPG6_URL: sources/epg6.xml.gz
          EPG37_URL: sources/epg37.xml.gz
        run: python build_epg.py
      - name: Validate generated gzip and XMLTV
        run: |
          python - <<'PY'
          import gzip, xml.etree.ElementTree as ET
          with gzip.open("site/epg.xml.gz", "rb") as f:
              root = ET.parse(f).getroot()
          channels = root.findall("channel")
          programmes = root.findall("programme")
          assert root.tag == "tv" and channels and programmes, "Invalid or empty guide"
          ids = {c.get("id") for c in channels}
          assert all(p.get("channel") in ids for p in programmes), "Unmapped programme channel ID"
          print("Validated:", len(channels), "channels,", len(programmes), "programmes")
          PY
      - name: Upload public source snapshots for ChatGPT review
        uses: actions/upload-artifact@v4
        with:
          name: public-epg-sources
          path: |
            sources/epg2.xml.gz
            sources/epg6.xml.gz
            sources/epg37.xml.gz
            sources/summary.json
          retention-days: 7
          if-no-files-found: error
      - name: Upload matching reports
        uses: actions/upload-artifact@v4
        with:
          name: epg-matching-reports
          path: reports/
          retention-days: 14
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
