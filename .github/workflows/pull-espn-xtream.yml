name: Pull Live Xtream ESPN Plus Inventory
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pull-espn-xtream.yml'
permissions:
  contents: read
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      XTREAM_URL: ${{ secrets.XTREAM_URL || secrets.XTREAM_HOST || secrets.XTREAM_SERVER }}
      XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME || secrets.XTREAM_USER }}
      XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD || secrets.XTREAM_PASS }}
    steps:
      - name: Fetch current live channel names
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, datetime, json, os, re, urllib.parse, urllib.request
          from pathlib import Path
          host=os.getenv('XTREAM_URL','').rstrip('/')
          user=os.getenv('XTREAM_USERNAME','')
          password=os.getenv('XTREAM_PASSWORD','')
          if not all((host,user,password)):
              raise SystemExit('Xtream secrets unavailable. Configure XTREAM_URL, XTREAM_USERNAME, XTREAM_PASSWORD (or supported aliases).')
          if not host.startswith(('http://','https://')):
              host='http://'+host
          params=urllib.parse.urlencode({'username':user,'password':password,'action':'get_live_streams'})
          req=urllib.request.Request(host+'/player_api.php?'+params,headers={'User-Agent':'My-EPG-inventory/1.0'})
          with urllib.request.urlopen(req,timeout=90) as response:
              streams=json.load(response)
          if not isinstance(streams,list):
              raise SystemExit('Xtream response was not a live-stream list')
          rows=[]
          for item in streams:
              name=str(item.get('name') or '')
              m=re.search(r'ESPN\s*(?:PLUS|\+)\s*0*(\d{1,3})(?!\d)',name,re.I)
              if not m or not 1<=int(m.group(1))<=600:
                  continue
              rows.append({'ESPNPlus':int(m.group(1)),'StreamID':str(item.get('stream_id','')),'OriginalName':name,'EPGID':str(item.get('epg_channel_id') or '')})
          rows.sort(key=lambda r:(r['ESPNPlus'],r['StreamID']))
          Path('inventory-output').mkdir(exist_ok=True)
          with open('inventory-output/espn-plus-1-600.csv','w',newline='',encoding='utf-8') as f:
              writer=csv.DictWriter(f,fieldnames=['ESPNPlus','StreamID','OriginalName','EPGID'])
              writer.writeheader();writer.writerows(rows)
          with open('inventory-output/espn-plus-165-175.md','w',encoding='utf-8') as f:
              f.write('# Live Xtream ESPN+ 165–175\n\nPulled '+datetime.datetime.now(datetime.timezone.utc).isoformat()+'\n\n')
              f.write('| ESPN+ | StreamID | Original Xtream name | EPGID |\n|---|---|---|---|\n')
              for row in rows:
                  if 165<=row['ESPNPlus']<=175:
                      f.write('| '+str(row['ESPNPlus'])+' | '+row['StreamID']+' | '+row['OriginalName'].replace('|','\\|').replace('\n',' ')+' | '+row['EPGID']+' |\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
              f.write('Fetched '+str(len(rows))+' ESPN+ entries. Download the inventory artifact for the 165–175 report.\n')
          print('ESPN+ entries:',len(rows))
          PY
      - name: Upload current inventory and 165–175 report
        uses: actions/upload-artifact@v4
        with:
          name: live-xtream-espn-plus
          path: inventory-output/
          retention-days: 7
