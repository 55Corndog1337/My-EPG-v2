name: Publish Searchable EPG Website
on:
  push:
    branches: [main]
    paths:
      - 'guide/**'
      - 'index.html'
      - 'v4-output/epg.xml.gz'
      - '.github/workflows/publish-search-guide.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage small public website
        run: |
          mkdir -p public/guide public/v4-output
          cp index.html public/index.html
          cp guide/index.html public/guide/index.html
          if [ -f v4-output/epg.xml.gz ]; then cp v4-output/epg.xml.gz public/v4-output/epg.xml.gz; fi
          find public -type f -printf '%p %s bytes\\n'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'
      - id: deployment
        uses: actions/deploy-pages@v4
