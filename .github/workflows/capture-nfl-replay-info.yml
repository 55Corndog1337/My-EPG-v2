name: Capture NFL Replay information board
on:
  workflow_dispatch:
  schedule:
    # Tuesday 8 AM Eastern (DST/standard time candidates).
    - cron: '0 12,13 * * 2'
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check Tuesday Eastern time
        id: clock
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ] || [ "$(TZ=America/New_York date +%H)" = 08 ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.clock.outputs.run == 'true'
      - name: Install FFmpeg and OCR
        if: steps.clock.outputs.run == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg tesseract-ocr
      - name: Capture replay information stream
        if: steps.clock.outputs.run == 'true'
        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
        run: |
          set +x
          mkdir -p snapshots
          python - <<'PY'
          import os, subprocess, urllib.parse, pathlib
          base=os.environ['XTREAM_URL'].rstrip('/')
          user=urllib.parse.quote(os.environ['XTREAM_USERNAME'],safe='')
          pwd=urllib.parse.quote(os.environ['XTREAM_PASSWORD'],safe='')
          # Xtream live endpoint for StreamID 1329643.
          url=f'{base}/live/{user}/{pwd}/1329643.ts'
          for n,offset in enumerate((8,20,35),1):
              cmd=['ffmpeg','-nostdin','-hide_banner','-loglevel','error',
                   '-rw_timeout','12000000','-i',url,'-ss',str(offset),
                   '-frames:v','1','-y',f'snapshots/nfl-replay-info-{n}.png']
              try:
                  result=subprocess.run(cmd,capture_output=True,text=True,timeout=95)
                  if result.returncode==0 and pathlib.Path(cmd[-1]).exists():
                      print(f'Frame {n}: captured')
                  else:
                      print(f'Frame {n}: unavailable (ffmpeg exit {result.returncode})')
              except subprocess.TimeoutExpired:
                  print(f'Frame {n}: timed out')
          if not list(pathlib.Path('snapshots').glob('*.png')):
              raise SystemExit('No frames captured; stream may be unreachable from GitHub')
          PY
      - name: OCR and validate board date range and replay assignments
        if: steps.clock.outputs.run == 'true'
        run: python nfl_replay_board.py snapshots
      - name: Commit confirmed weekly assignments
        if: steps.clock.outputs.run == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/nfl-replay-board.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified NFL Replay OCR assignments'
            git push
          fi
      - name: Delete temporary screenshots
        if: always()
        run: rm -rf snapshots
