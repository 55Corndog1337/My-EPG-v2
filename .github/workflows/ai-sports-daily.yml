name: Daily AI sports schedule research
on:
  workflow_dispatch:
  schedule:
    - cron: '40 10 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      XTREAM_URL: ${{ secrets.XTREAM_URL }}
      XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
      XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check scripts
        run: python -m py_compile ai_sports.py build_epg.py
      - name: Refresh Xtream inventory and build safe baseline
        run: python build_epg.py
      - name: Research numbered sports feeds with web verification
        continue-on-error: true
        run: python ai_sports.py
      - name: Commit verified schedule cache
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/ai-sports-events.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified AI sports schedule cache"
            git push
          fi
      - name: Build final EPG with verified AI schedules
        run: python build_epg.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
