name: Daily AI sports schedule research
on:
  workflow_dispatch:
  push:
    paths:
      - 'ai_sports.py'
      - 'schedule_sources.py'
      - 'ncaab_calendar_match.py'
      - 'ncaab_epg2_raw.py'
      - '.github/workflows/ai-sports-daily.yml'
  schedule:
    - cron: '40 10 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      XTREAM_URL: ${{ secrets.XTREAM_URL }}
      XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
      XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check scripts
        run: python -m py_compile ai_sports.py build_epg.py schedule_sources.py ncaab_calendar_match.py ncaab_epg2_raw.py
      - name: Refresh Xtream inventory and build safe baseline
        run: python build_epg.py
      - name: Extract raw NCAAB listings from EPG2
        run: python ncaab_epg2_raw.py
      - name: Commit raw NCAAB data independently
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/ncaab-epg2-raw.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh raw NCAAB EPG2 programme data"
            git push
          fi
      - name: Refresh live season calendar feeds and check platform schedules
        run: python schedule_sources.py
      - name: Match numbered NCAAB EPG2 events against basketball calendar
        run: python ncaab_calendar_match.py
      - name: Upload raw NCAAB matchup audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ncaab-epg2-calendar-audit
          path: reports/ncaab-calendar-match-*.json
          if-no-files-found: warn
      - name: Research numbered sports feeds with web verification
        run: python ai_sports.py
      - name: Commit verified schedule cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/ai-sports-events.json reports/schedule-source-events.json reports/ncaab-calendar-match-*.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified AI sports schedule cache"
            git push
          fi
      - name: Build final EPG with verified AI schedules
        run: python build_epg.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
