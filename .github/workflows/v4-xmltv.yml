name: V4 Independent XMLTV Generator
on:
  push:
    branches: [main]
    paths:
      - 'v4/**'
      - 'v4/build.py'
      - 'v4-mappings/**'
      - '.github/workflows/v4-xmltv.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'
permissions:
  contents: write
  actions: read
concurrency:
  group: v4-xmltv-generator
  cancel-in-progress: false
jobs:
  build-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Restore archived full Xtream matching report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          run-id: 42523714141
          pattern: epg-matching-reports*
          path: v4-input
          merge-multiple: true
          github-token: ${{ github.token }}
      - name: Recover known inventory artifact directly
        if: ${{ hashFiles('v4-input/**/ALL_CHANNELS_Renamed.csv', 'v4-input/ALL_CHANNELS_Renamed.csv') == '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p v4-input
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/13634518145/zip > /tmp/v4-inventory.zip
          unzip -o /tmp/v4-inventory.zip -d v4-input
      - name: Identify V4 inventory inputs
        run: |
          echo 'Available V4 mapping files:'
          find v4-mappings -maxdepth 1 -type f | sort
          echo 'Local inventory candidates:'
          find . -maxdepth 3 -iname '*inventory*.csv' -o -iname '*all_channels_renamed.csv' | head -30
      - name: Generate independent V4 guide
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 v4/build.py
      - name: Publish V4 output only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v4-output/epg.xml.gz v4-output/coverage.json v4-output/epg-source-catalog.csv v4-output/ncaab-original-id-test.xml.gz
          if ! git diff --cached --quiet; then
            git commit -m "Update independent V4 XMLTV guide"
            # Other workflows may update main during this build.
            # Retry safely without force-pushing or modifying V2.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Rebase conflict: refusing to overwrite other commits."
                exit 1
              fi
              if git push origin HEAD:main; then
                echo "Published V4 output successfully."
                exit 0
              fi
              echo "Push attempt $attempt failed; checking for concurrent updates."
              sleep 5
            done
            echo "V4 publish failed after retries. Check branch rules and token permissions."
            exit 1
          fi
