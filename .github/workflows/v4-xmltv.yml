name: V4 Combined EPG 2 6 37
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'v4/build.py'
      - '.github/workflows/v4-xmltv.yml'
  schedule:
    - cron: '17 10 * * *'
permissions:
  contents: write
concurrency:
  group: v4-xmltv-generator
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Merge source guides
        run: python3 v4/build.py
      - name: Validate XMLTV
        run: |
          python3 - <<'PY'
          import gzip,xml.etree.ElementTree as ET
          with gzip.open('v4-output/epg.xml.gz','rb') as f:
              root=ET.parse(f).getroot()
          assert root.tag=='tv'
          assert len(root.findall('channel'))>0
          assert len(root.findall('programme'))>0
          print('XMLTV valid')
          PY
      - name: Publish combined guide
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp v4-output/epg.xml.gz /tmp/combined-epg.xml.gz
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/combined-epg.xml.gz v4-output/epg.xml.gz
            git add v4-output/epg.xml.gz
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Refresh combined EPG 2 6 37"
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
