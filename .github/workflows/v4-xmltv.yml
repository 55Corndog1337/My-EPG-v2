name: Combined EPG 2 UK6 Sports37 AHL
# Manual refresh requested November 12, 2026 at 3:48 PM Eastern.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'v4/build.py'
      - '.github/workflows/v4-xmltv.yml'
  schedule:
    # Hourly trigger; local-time gate below handles EST and EDT.
    - cron: '0 * * * *'
permissions:
  contents: write
concurrency:
  group: v4-xmltv-generator
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check Eastern schedule
        id: clock
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          hour = datetime.now(ZoneInfo('America/New_York')).hour
          allowed = os.environ['EVENT_NAME'] != 'schedule' or hour in (6, 12, 15, 18)
          print('run=' + str(allowed).lower())
          print('Eastern hour:', hour, file=__import__('sys').stderr)
          PY
      - uses: actions/checkout@v4
        if: steps.clock.outputs.run == 'true'
      - name: Merge source guides
        if: steps.clock.outputs.run == 'true'
        run: python3 v4/build.py
      - name: Validate XMLTV
        if: steps.clock.outputs.run == 'true'
        run: |
          python3 - <<'PY'
          import gzip,xml.etree.ElementTree as ET
          with gzip.open('v4-output/epg.xml.gz','rb') as f:
              root=ET.parse(f).getroot()
          assert root.tag=='tv'
          assert len(root.findall('channel'))>0
          assert len(root.findall('programme'))>0
          print('XMLTV valid')
          PY
      - name: Publish combined guide
        if: steps.clock.outputs.run == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp v4-output/epg.xml.gz /tmp/combined-epg.xml.gz
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/combined-epg.xml.gz v4-output/epg.xml.gz
            git add v4-output/epg.xml.gz
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Refresh combined EPG 2 6 37"
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
