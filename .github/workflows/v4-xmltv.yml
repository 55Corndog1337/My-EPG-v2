name: V4 Independent XMLTV Generator
on:
  push:
    branches: [main]
    paths:
      - 'v4/**'
      - 'v4-mappings/**'
      - '.github/workflows/v4-xmltv.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'
permissions:
  contents: write
  actions: read
concurrency:
  group: v4-xmltv-generator
  cancel-in-progress: false
jobs:
  build-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Restore archived full Xtream matching report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          run-id: 42523714141
          pattern: epg-matching-reports*
          path: v4-input
          merge-multiple: true
          github-token: ${{ github.token }}
      - name: Identify V4 inventory inputs
        run: |
          echo 'Available V4 mapping files:'
          find v4-mappings -maxdepth 1 -type f | sort
          echo 'Local inventory candidates:'
          find . -maxdepth 3 -iname '*inventory*.csv' -o -iname '*all_channels_renamed.csv' | head -30
      - name: Generate independent V4 guide
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 v4/build.py
      - name: Publish V4 output only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v4-output/epg.xml.gz v4-output/coverage.json
          if ! git diff --cached --quiet; then
            git commit -m "Update independent V4 XMLTV guide"
            git push
          fi
