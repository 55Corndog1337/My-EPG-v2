name: V4 raw mapping source snapshot
on:
  workflow_dispatch:
  push:
    paths:
      - 'v4_snapshot.py'
      - '.github/workflows/v4-raw-snapshot.yml'
  schedule:
    - cron: '15 */4 * * *'
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      XTREAM_URL: ${{ secrets.XTREAM_URL }}
      XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
      XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate snapshot scripts
        run: python -m py_compile v4_snapshot.py build_epg.py encrypt_inventory.py
      - name: Refresh Xtream inventory
        run: python build_epg.py
      - name: Fetch original EPG 2, 6 and 37 XMLTV and channel indexes
        run: python v4_snapshot.py
      - name: Encrypt live Xtream channel inventory
        env:
          XTREAM_EXPORT_PASSWORD: ${{ secrets.XTREAM_EXPORT_PASSWORD }}
        run: |
          python -m pip install 'cryptography>=43,<47'
          python encrypt_inventory.py
          cp encrypted-export/xtream-channels-latest.enc.json v4-snapshot/
      - name: Upload all four raw source datasets
        uses: actions/upload-artifact@v4
        with:
          name: v4-raw-mapping-sources
          path: v4-snapshot/
          retention-days: 30
          if-no-files-found: error
