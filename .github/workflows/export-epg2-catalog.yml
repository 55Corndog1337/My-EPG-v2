name: Export readable EPG2 channel catalog
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/export-epg2-catalog.yml'
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and export raw EPG2 channel IDs and display names
        run: |
          python3 - <<'PY'
          import csv, gzip, io, urllib.request, xml.etree.ElementTree as ET
          from pathlib import Path
          url="https://raw.githubusercontent.com/ferteque/Curated-M3U-Repository/main/epg2.xml.gz"
          data=urllib.request.urlopen(url,timeout=120).read()
          if data[:2]==b"\x1f\x8b":data=gzip.decompress(data)
          channels=[]
          for _,element in ET.iterparse(io.BytesIO(data),events=("end",)):
              if element.tag=="channel":
                  names=[(n.text or "").strip() for n in element.findall("display-name")]
                  channels.append((element.get("id","")," | ".join(names)))
                  element.clear()
              elif element.tag=="programme":element.clear()
          out=Path("v4-output");out.mkdir(exist_ok=True)
          def export(path,rows):
              with open(out/path,"w",newline="",encoding="utf-8") as f:
                  writer=csv.writer(f);writer.writerow(["EPG2 source ID","Original display names"]);writer.writerows(rows)
          export("epg2-all-raw-channels.csv",channels)
          nfl=[r for r in channels if any(word in (r[0]+" "+r[1]).lower() for word in ("nfl","football","redzone","red zone"))]
          export("epg2-nfl-raw-channels.csv",nfl)
          with open(out/"epg2-nfl-raw-channels.txt","w",encoding="utf-8") as f:
              f.write("EPG2 ORIGINAL NFL / FOOTBALL CHANNELS\nSource ID | Original display name(s)\n\n")
              for source,name in nfl:f.write(f"{source} | {name}\n")
          print(f"EPG2 catalog {len(channels)} channels; NFL/football candidates {len(nfl)}")
          for source,name in nfl:print(f"{source} | {name}")
          PY
      - name: Commit readable catalogs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v4-output/epg2-all-raw-channels.csv v4-output/epg2-nfl-raw-channels.csv v4-output/epg2-nfl-raw-channels.txt
          git diff --cached --quiet || (git commit -m "Export searchable raw EPG2 NFL channel catalog" && git push)
