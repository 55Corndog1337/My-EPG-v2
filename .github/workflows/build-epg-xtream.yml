name: Build EPG (Xtream playlist first)

on:
  workflow_dispatch:
  schedule:
    - cron: '15 */4 * * *'  # Every four hours, UTC

permissions:
  contents: write

concurrency:
  group: epg-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refresh Xtream playlist, then build existing EPG
        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
        run: python build_epg.py

      - name: Build separate Xtream sports EPG
        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
        run: python dual_sports_epg.py --xtream-only --output-dir site

      - name: Publish generated EPG and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/epg.xml.gz site/epg-xtream.xml.gz site/index.html site/.nojekyll
          if [ -d reports ]; then git add reports/; fi
          if ! git diff --cached --quiet; then
            git commit -m "Update full and Xtream sports EPGs"
            git push
          fi

      - name: Upload EPG downloads to this workflow run
        uses: actions/upload-artifact@v4
        with:
          name: epg-guides
          path: |
            site/epg.xml.gz
            site/epg-xtream.xml.gz
          if-no-files-found: error
          retention-days: 30

      - name: Show EPG download links in build summary
        if: success()
        env:
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "## EPG build complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- [Download EPG guides artifact (ZIP)](https://github.com/$REPO/actions/runs/$RUN_ID#artifacts)" >> "$GITHUB_STEP_SUMMARY"
          echo "- [Full EPG](https://raw.githubusercontent.com/$REPO/HEAD/site/epg.xml.gz)" >> "$GITHUB_STEP_SUMMARY"
          echo "- [Xtream sports EPG](https://raw.githubusercontent.com/$REPO/HEAD/site/epg-xtream.xml.gz)" >> "$GITHUB_STEP_SUMMARY"
