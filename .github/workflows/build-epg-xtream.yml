name: Build EPG (Xtream playlist first)

on:
  workflow_dispatch:
  schedule:
    - cron: '15 11 * * *'  # Daily 6:15 AM EST / 7:15 AM EDT

permissions:
  contents: write

concurrency:
  group: epg-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh Xtream playlist, then build EPG
        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
        run: python build_epg.py
      - name: Publish generated EPG and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/epg.xml.gz site/index.html site/.nojekyll reports/
          if ! git diff --cached --quiet; then
            git commit -m "Update EPG from refreshed Xtream playlist"
            git push
          fi
