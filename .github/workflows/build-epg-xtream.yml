name: Build full Xtream and M3U EPGs
on:
  workflow_dispatch:
  schedule:
    # UTC candidates for 6 AM, noon, 6 PM America/New_York (EST/EDT).
    - cron: '0 10,11,16,17,22,23 * * *'
permissions:
  contents: write
concurrency:
  group: epg-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check Eastern schedule
        id: clock
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          HOUR=$(TZ=America/New_York date +%H)
          if [ "$EVENT_NAME" = workflow_dispatch ] || [[ "$HOUR" =~ ^(06|12|18)$ ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo "Skipping UTC candidate; Eastern hour is $HOUR"
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.clock.outputs.run == 'true'
      - uses: actions/setup-python@v5
        if: steps.clock.outputs.run == 'true'
        with:
          python-version: '3.11'
      - name: Build existing working full EPG
        if: steps.clock.outputs.run == 'true'
        env:
          PLAYLIST_URL: ${{ secrets.PLAYLIST_URL }}
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
        run: python build_epg.py
      - name: Download EPG37 for NCAAF network schedules
        if: steps.clock.outputs.run == 'true'
        run: |
          python - <<'PY'
          import urllib.request
          urllib.request.urlretrieve('https://raw.githubusercontent.com/ferteque/Curated-M3U-Repository/main/epg37.xml.gz','epg37.xml.gz')
          PY
      - name: Overlay sports onto both full guides
        if: steps.clock.outputs.run == 'true'
        env:
          PLAYLIST_URL: ${{ secrets.PLAYLIST_URL }}
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
        run: python sports_overlay.py --base site/epg.xml.gz --output-dir site --epg37-file epg37.xml.gz
      - name: Clean sports channel names and add matchup descriptions
        if: steps.clock.outputs.run == 'true'
        run: python sports_xmltv_presentation.py site/epg.xml.gz site/epg-xtream.xml.gz site/epg-m3u.xml.gz
      - name: Verify AHL Xtream mappings in published XMLTV
        if: steps.clock.outputs.run == 'true'
        run: |
          python - <<'PY'
          import csv, gzip, xml.etree.ElementTree as ET
          from collections import Counter
          from pathlib import Path
          inventory = list(csv.DictReader(open('channels.csv', encoding='utf-8-sig')))
          targets = {}
          for row in inventory:
              name = (row.get('ChannelName') or '').upper()
              group = (row.get('Group') or '').upper()
              sid = (row.get('StreamID') or '').strip()
              if 'AHL' in group and 'AHL TEAMS' in name and sid.isdigit() and not name.strip().startswith('#####'):
                  targets['xtream.' + sid] = row['ChannelName']
          assert len(targets) == 32, f'Expected 32 AHL teams, got {len(targets)}'
          season_ids = set()
          with open('reports/ahl-season-2026-27.csv', newline='', encoding='utf-8-sig') as f:
              season_ids = {row['XMLTV_ID'] for row in csv.DictReader(f)}
          assert season_ids <= targets.keys(), 'AHL season contains unmapped Xtream IDs'
          for path in ('site/epg.xml.gz', 'site/epg-xtream.xml.gz'):
              with gzip.open(path, 'rb') as f:
                  root = ET.parse(f).getroot()
              channels = {ch.get('id') for ch in root.findall('channel')}
              count = Counter(p.get('channel') for p in root.findall('programme'))
              missing = sorted(set(targets) - channels)
              empty = sorted(k for k in targets if not count[k])
              assert not missing, f'{path}: AHL channel IDs missing: {missing}'
              assert not empty, f'{path}: AHL programmes missing: {empty}'
              print(path, 'AHL channels:', len(targets), 'programmes:', sum(count[k] for k in targets))
          print('AHL mapping verified; schedule IDs:', len(season_ids),
                'Bridgeport fallback:', 'xtream.1056397' not in season_ids)
          PY
      - name: Publish guides and public diagnostics only
        if: steps.clock.outputs.run == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/epg.xml.gz site/epg-xtream.xml.gz site/epg-m3u.xml.gz
          git add reports/sports-m3u-mapping.csv reports/epg37-regular-matches.csv
          if [ -f reports/ahl-season-2026-27.csv ]; then git add reports/ahl-season-2026-27.csv; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update full Xtream and edited M3U EPGs'
            git push
          fi
      - name: Upload guides and mapping report
        if: steps.clock.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: epg-guides-and-private-playlist
          path: |
            site/epg.xml.gz
            site/epg-xtream.xml.gz
            site/epg-m3u.xml.gz
            reports/sports-m3u-mapping.csv
            reports/epg37-regular-matches.csv
            reports/ahl-season-2026-27.csv
          if-no-files-found: error
          retention-days: 7
